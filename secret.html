<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Secret Letter</title>
  <link rel="stylesheet" href="/secret.css" />
  <meta name="color-scheme" content="light" />
</head>
<body>
  <main class="center">
    <section class="scene">
      <input id="open" type="checkbox" />

      <label class="envelope" for="open" aria-hidden="true">
        <span class="seal">♡</span>
        <div class="flap"></div>
      </label>

      <article class="letter" aria-hidden="false">
        <h1 class="question">Will you go on a date with me?</h1>
        <div class="choices">
          <button id="yes" class="btn btn-yes">Yes</button>
          <button id="no" class="btn btn-no">No</button>
        </div>
      </article>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const yes = document.getElementById("yes");
      const no = document.getElementById("no");
      const letter = document.querySelector('.letter');

      yes.addEventListener("click", function(){
        letter.innerHTML = '<h1>Yes!</h1><p>Fantastic — I can\'t wait. I\'ll plan something special.</p>';
      });

      no.addEventListener("click", function(){
        letter.innerHTML = '<h1>It\'s okay</h1><p>No pressure — I appreciate your honesty.</p>';
      });
    });
  </script>
</body>
</html>
