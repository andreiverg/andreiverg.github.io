<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Andrei Vergara — creative technologist in Auckland working across code, motion and photography.">

  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
  <meta name="theme-color" content="#ffffff">

  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Inter+Tight:ital,wght@0,400..600;1,400..500&family=Yellowtail&display=swap">

  <link rel="stylesheet" href="/src/landing.css">
  <script>document.documentElement.classList.add('js');</script>
  <script type="module" src="/src/landing.js"></script>

  <title>Andrei Vergara — Portfolio</title>
</head>
<body>
  <main class="landing" data-landing>
    <!-- Background: grain + two soft colour fields (blue from ref 3, warm from ref 4) -->
    <div class="bg" aria-hidden="true">
      <span class="blob blob-warm" data-build="blob"></span>
      <span class="blob blob-blue" data-build="blob"></span>
      <span class="grain"></span>
    </div>

    <div class="stage">
      <div class="lockup">
        <h1 class="sr-only">Andrei Vergara — Portfolio. Creative technologist, 2026.</h1>

        <span class="year" data-build="year" aria-hidden="true"><span class="year-text">2026</span></span>
        <span class="role" data-build="role" aria-hidden="true">Creative Technologist</span>

        <span class="word" data-build="word" aria-hidden="true">
          <span class="word-ghost word-ghost-1">portfolio</span>
          <span class="word-ghost word-ghost-2">portfolio</span>
          <span class="word-main" data-word>portfolio</span>
        </span>

        <a href="/about" class="sign" data-build="sign" aria-label="Andrei Vergara: about me">Andrei Vergara</a>
        <a href="/about" class="sign-pop" data-build="pop" tabindex="-1" aria-hidden="true">
          <span class="pop-pin">A</span>
          <span class="pop-bubble"><b>Who’s that?</b><span>Meet Andrei <i>→</i></span></span>
        </a>

        <span class="badge" data-build="badge" aria-hidden="true">
          <svg class="badge-ring" viewBox="0 0 200 200">
            <defs><path id="badge-circle" d="M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/></defs>
            <text><textPath href="#badge-circle" textLength="462">CODE · MOTION · PHOTOGRAPHY · </textPath></text>
          </svg>
          <svg class="badge-cursor" viewBox="0 0 64 64">
            <defs>
              <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffd59a"/>
                <stop offset="0.45" stop-color="#ff7a59"/>
                <stop offset="1" stop-color="#d9367a"/>
              </linearGradient>
              <linearGradient id="gloss-hi" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M14 8 L54 28 L36 34 L28 52 Z" fill="url(#gloss)" stroke="#9b2a55" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M18 14 L44 27 L33 30 Z" fill="url(#gloss-hi)"/>
          </svg>
        </span>
      </div>

      <nav class="links" aria-label="Primary">
        <a href="/projects" data-build="link"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l4.5-4.5"/></svg>Projects</a>
        <a href="/photography" data-build="link"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l4.5-4.5"/></svg>Photography</a>
        <a href="/social" data-build="link"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l4.5-4.5"/></svg>Social Media</a>
        <a href="https://www.linkedin.com/in/john-andrei-vergara-3b9921285/" target="_blank" rel="noopener noreferrer" data-build="link"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l4.5-4.5"/></svg>LinkedIn<span class="ext" aria-hidden="true">↗</span></a>
        <a href="mailto:andreivergara@outlook.co.nz" data-compose data-build="link"><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l4.5-4.5"/></svg>Contact</a>
      </nav>
    </div>

    <div class="corner">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
    </div>

    <button type="button" class="replay" data-replay hidden>
      <span aria-hidden="true">↻</span> Replay build
    </button>

    <!-- Figma-style build overlay (decorative, removed from the a11y tree) -->
    <div class="fig" aria-hidden="true" data-fig>
      <div class="fig-grid"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

      <div class="fig-file">
        <span class="fig-file-icon"></span>
        <span class="fig-file-path">Drafts / <b>portfolio-landing</b></span>
      </div>

      <div class="fig-select" data-fig-select>
        <i></i><i></i><i></i><i></i>
        <span class="fig-size" data-fig-size></span>
      </div>
      <div class="fig-measure" data-fig-measure><span data-fig-measure-label></span></div>
      <span class="fig-caret" data-fig-caret></span>

      <div class="fig-toolbar" data-fig-toolbar>
        <span data-tool="move"><svg viewBox="0 0 24 24"><path d="M6 4l12 7-5.5 1.5L10 18z"/></svg></span>
        <span data-tool="frame"><svg viewBox="0 0 24 24"><path d="M8 3v18M16 3v18M3 8h18M3 16h18" fill="none"/></svg></span>
        <span data-tool="shape"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none"/></svg></span>
        <span data-tool="pen"><svg viewBox="0 0 24 24"><path d="M12 3l6 10-6 8-6-8z M12 13v-2" fill="none"/></svg></span>
        <span data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13" fill="none"/></svg></span>
        <span data-tool="comment"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H11l-4 4v-4H5z" fill="none"/></svg></span>
      </div>

      <div class="fig-cursor" data-fig-cursor>
        <svg viewBox="0 0 24 24"><path d="M4 2.5l15 8.2-6.6 1.8-3.3 6.3z"/></svg>
        <span class="fig-name">Andrei</span>
      </div>
    </div>
  </main>
</body>
</html>
